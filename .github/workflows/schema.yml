name: schema

on:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - ".github/workflows/schema.yml"
  pull_request:
    paths:
      - "schema/**"
      - ".github/workflows/schema.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schema
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: schema/package-lock.json
      - run: npm ci
      - run: npm test
